name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - uses: bufbuild/buf-setup-action@v1
      - run: npm ci
      - run: buf lint
      - run: buf breaking --against '.git#branch=main'
      - run: npm run test:json-schema-compat
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: >-
          RUN_INTEGRATION=true npx vitest run --no-file-parallelism
          tests/integration/cdc.test.ts
          -t 'publishes the committed canonical envelope only after append'

  pr-full:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: >-
          RUN_INTEGRATION=true RUN_STRESS=true npx vitest run --no-file-parallelism
          tests/sql-contract tests/integration tests/unit
          --reporter=json --outputFile=pr-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-full-results
          path: pr-full.json
          retention-days: 35

  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: RUN_STRESS=true npx vitest run tests/sql-contract/concurrency.test.ts

  latency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: RUN_LATENCY=true npx vitest run tests/performance/cdc-latency.test.ts
