name: Release latency profile

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: RUN_INTEGRATION=true RUN_STRESS=true npm test
      - run: >-
          RUN_INTEGRATION=true npx vitest run --no-file-parallelism
          tests/integration/migrate-role-passwords.test.ts
          --reporter=json --outputFile=release-migration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gates
          path: release-migration.json
          retention-days: 365

  cdc-latency:
    needs: release-gates
    runs-on: [self-hosted, event-store-performance]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: >-
          RUN_LATENCY=true RUN_RELEASE_LATENCY=true
          LATENCY_DURATION_MS=1800000 LATENCY_SAMPLE_COUNT=100
          LATENCY_CONCURRENCY=16 LATENCY_APPEND_RATE=100
          LATENCY_BATCH_SIZE=1 LATENCY_PAYLOAD_BYTES=2048
          LATENCY_STREAM_COUNT=1000 LATENCY_HOT_STREAM_PERCENT=0
          npx vitest run tests/performance/cdc-latency.test.ts
          --reporter=json --outputFile=release-latency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-latency
          path: release-latency.json
          retention-days: 365
