# Requires CloudNativePG 1.27+ with PostgreSQL 18 images available in the registry.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: event-store-postgres
  labels:
    app.kubernetes.io/part-of: event-store
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: event_store
  minSyncReplicas: 1
  maxSyncReplicas: 1
  postgresql:
    parameters:
      max_replication_slots: "10"
      max_wal_senders: "10"
      max_slot_wal_keep_size: 8GB
      synchronous_commit: "on"
      track_commit_timestamp: "off"
  replicationSlots:
    highAvailability:
      enabled: true
      synchronizeLogicalDecoding: true
    synchronizeReplicas:
      enabled: true
    updateInterval: 5
  backup:
    target: prefer-standby
    retentionPolicy: "35d"
    barmanObjectStore:
      destinationPath: s3://event-store-backups/production
      s3Credentials:
        accessKeyId:
          name: event-store-backup-s3
          key: access-key-id
        secretAccessKey:
          name: event-store-backup-s3
          key: secret-access-key
      wal:
        compression: gzip
  storage:
    size: 200Gi
  walStorage:
    size: 256Gi
  resources:
    requests: { cpu: "8", memory: 32Gi }
    limits: { cpu: "8", memory: 32Gi }
  monitoring:
    enablePodMonitor: true
    customQueriesConfigMap:
      - name: event-store-postgres-monitoring
        key: custom-queries
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: event-store-postgres-daily
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: event-store-postgres
  method: barmanObjectStore
  target: prefer-standby
