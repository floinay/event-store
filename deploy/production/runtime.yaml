apiVersion: v1
kind: Service
metadata:
  name: event-store
spec:
  selector: { app: event-store }
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-store
spec:
  replicas: 3
  selector:
    matchLabels: { app: event-store }
  template:
    metadata:
      labels: { app: event-store }
    spec:
      containers:
        - name: event-store
          image: event-store-service:latest
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 8080 }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: event-store-app, key: database-url }
            - name: CONNECT_URL
              value: http://event-store-connect:8083
            - name: CDC_WAL_BUDGET_BYTES
              value: "8589934592"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: event-store-connect
spec:
  selector: { app: event-store-connect }
  ports:
    - { name: rest, port: 8083, targetPort: rest }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-store-connect
spec:
  replicas: 3
  selector:
    matchLabels: { app: event-store-connect }
  template:
    metadata:
      labels: { app: event-store-connect }
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.6.0.Final
          ports: [{ name: rest, containerPort: 8083 }]
          env:
            - { name: BOOTSTRAP_SERVERS, value: event-store-kafka-kafka-bootstrap:9092 }
            - { name: GROUP_ID, value: event-store-connect }
            - { name: CONFIG_STORAGE_TOPIC, value: _connect-event-store-configs }
            - { name: OFFSET_STORAGE_TOPIC, value: _connect-event-store-offsets }
            - { name: STATUS_STORAGE_TOPIC, value: _connect-event-store-status }
            - { name: CONFIG_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: OFFSET_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: STATUS_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: EXACTLY_ONCE_SOURCE_SUPPORT, value: enabled }
            - { name: CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT, value: enabled }
            - { name: CONNECT_CONFIG_PROVIDERS, value: file }
            - { name: CONNECT_CONFIG_PROVIDERS_FILE_CLASS, value: org.apache.kafka.common.config.provider.FileConfigProvider }
          volumeMounts:
            - { name: cdc-secret, mountPath: /run/secrets, readOnly: true }
      volumes:
        - name: cdc-secret
          secret: { secretName: event-store-cdc-properties }
