apiVersion: v1
kind: Service
metadata:
  name: event-store
spec:
  selector: { app: event-store }
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-store
spec:
  replicas: 3
  selector:
    matchLabels: { app: event-store }
  template:
    metadata:
      labels: { app: event-store }
    spec:
      containers:
        - name: event-store
          image: event-store-service:1.0.0
          ports:
            - { name: grpc, containerPort: 50051 }
            - { name: http, containerPort: 8080 }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: event-store-app, key: database-url }
            - name: CRITICAL_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: event-store-critical-app, key: database-url }
            - name: PRODUCER_SERVICE
              value: event-store-service
            - name: CONNECT_URL
              value: http://event-store-connect:8083
            - name: CONNECT_METRICS_PORT
              value: "9404"
            - name: KAFKA_BROKERS
              value: event-store-kafka-kafka-bootstrap:9092
            - name: KAFKA_LIVE_MIN_ISR
              value: "2"
            - name: HTTP_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: CDC_WAL_BUDGET_BYTES
              value: "8589934592"
            - name: GRPC_TLS_CERT_PEM
              valueFrom:
                secretKeyRef: { name: event-store-grpc-tls, key: cert.pem }
            - name: GRPC_TLS_KEY_PEM
              valueFrom:
                secretKeyRef: { name: event-store-grpc-tls, key: key.pem }
            - name: GRPC_TLS_CA_PEM
              valueFrom:
                secretKeyRef: { name: event-store-grpc-tls, key: ca.pem }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: event-store-connect
spec:
  selector: { app: event-store-connect }
  ports:
    - { name: rest, port: 8083, targetPort: rest }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-store-connect
spec:
  replicas: 3
  selector:
    matchLabels: { app: event-store-connect }
  template:
    metadata:
      labels: { app: event-store-connect }
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.6.0.Final
          ports: [{ name: rest, containerPort: 8083 }]
          env:
            - { name: BOOTSTRAP_SERVERS, value: event-store-kafka-kafka-bootstrap:9092 }
            - { name: GROUP_ID, value: event-store-connect }
            - { name: CONFIG_STORAGE_TOPIC, value: _connect-event-store-configs }
            - { name: OFFSET_STORAGE_TOPIC, value: _connect-event-store-offsets }
            - { name: STATUS_STORAGE_TOPIC, value: _connect-event-store-status }
            - { name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: KEY_CONVERTER, value: org.apache.kafka.connect.storage.StringConverter }
            - { name: VALUE_CONVERTER, value: org.apache.kafka.connect.json.JsonConverter }
            - { name: VALUE_CONVERTER_SCHEMAS_ENABLE, value: "false" }
            - { name: CONNECT_HEADER_CONVERTER, value: org.apache.kafka.connect.storage.SimpleHeaderConverter }
            - { name: EXACTLY_ONCE_SOURCE_SUPPORT, value: enabled }
            - { name: CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT, value: enabled }
            - { name: CONNECT_TOPIC_CREATION_ENABLE, value: "false" }
            - { name: CONNECT_PRODUCER_ACKS, value: all }
            - { name: CONNECT_PRODUCER_ENABLE_IDEMPOTENCE, value: "true" }
            - { name: CONNECT_PRODUCER_LINGER_MS, value: "0" }
            - { name: CONNECT_PRODUCER_COMPRESSION_TYPE, value: lz4 }
            - { name: CONNECT_PRODUCER_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION, value: "5" }
            - { name: CONNECT_CONSUMER_ISOLATION_LEVEL, value: read_committed }
            - { name: CONNECT_CONFIG_PROVIDERS, value: file }
            - { name: CONNECT_CONFIG_PROVIDERS_FILE_CLASS, value: org.apache.kafka.common.config.provider.FileConfigProvider }
            - { name: JMXPORT, value: "9999" }
            - { name: JMXHOST, value: 127.0.0.1 }
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - { name: CONNECT_REST_ADVERTISED_PORT, value: "8083" }
          volumeMounts:
            - { name: cdc-secret, mountPath: /run/secrets, readOnly: true }
        - name: jmx-exporter
          image: event-store-connect-metrics:1.6.0
          ports: [{ name: metrics, containerPort: 9404 }]
          volumeMounts:
            - { name: jmx-config, mountPath: /etc/jmx-exporter, readOnly: true }
      volumes:
        - name: cdc-secret
          secret: { secretName: event-store-cdc-properties }
        - name: jmx-config
          configMap: { name: event-store-connect-jmx }
