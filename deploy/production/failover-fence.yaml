# CNPG has no pre-promotion SQL hook. Once the database is ready, disable its
# reconciliation loop before bootstrap permits the first acknowledged append.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-store-cnpg-fence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: event-store-cnpg-fence
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    resourceNames: ["event-store-postgres"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: event-store-cnpg-fence
subjects:
  - kind: ServiceAccount
    name: event-store-cnpg-fence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: event-store-cnpg-fence
---
apiVersion: batch/v1
kind: Job
metadata:
  name: event-store-cnpg-fence
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: event-store-cnpg-fence
      restartPolicy: OnFailure
      containers:
        - name: disable-automatic-promotion
          image: bitnami/kubectl:1.34.1
          command:
            - sh
            - -ec
            - >-
              until kubectl get cluster.postgresql.cnpg.io event-store-postgres
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
              | grep -qx True; do sleep 2; done;
              kubectl annotate cluster.postgresql.cnpg.io event-store-postgres
              cnpg.io/reconciliationLoop=disabled --overwrite;
              test "$(kubectl get cluster.postgresql.cnpg.io event-store-postgres
              -o jsonpath='{.metadata.annotations.cnpg\.io/reconciliationLoop}')"
              = disabled
