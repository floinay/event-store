# Requires Strimzi 0.46+ with KRaft and node pools enabled.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: event-store-dual-role
  labels:
    strimzi.io/cluster: event-store-kafka
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Ti
        deleteClaim: false
  resources:
    requests: { cpu: "8", memory: 32Gi }
    limits: { cpu: "8", memory: 32Gi }
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: event-store-kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.3.1
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: event-store-kafka-metrics
          key: kafka-metrics-config.yml
    config:
      num.partitions: 24
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      unclean.leader.election.enable: false
      auto.create.topics.enable: false
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-store-kafka-metrics
data:
  # Empty JMX-exporter rules intentionally expose all Kafka broker metrics;
  # PrometheusRule below pins the reliability-critical names.
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules: []
