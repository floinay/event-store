apiVersion: batch/v1
kind: CronJob
metadata:
  name: event-store-projection-failure-prune
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: prune
              image: postgres:18.4-bookworm
              command:
                - sh
                - -ec
                - >-
                  psql "$DATABASE_URL" -v ON_ERROR_STOP=1
                  -c "SELECT projection_runtime.prune_failures()"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: event-store-app
                      key: database-url
