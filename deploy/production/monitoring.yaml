apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: event-store
  labels:
    app: event-store
spec:
  selector:
    matchLabels: { app: event-store }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: event-store-connect
  labels:
    app: event-store
spec:
  selector:
    matchLabels: { app: event-store-connect }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: event-store-kafka
  labels:
    app: event-store
spec:
  selector:
    matchLabels:
      strimzi.io/cluster: event-store-kafka
  endpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: event-store-reliability
  labels:
    app: event-store
spec:
  groups:
    - name: event-store.reliability
      rules:
        - alert: EventStoreAppendUnknownOutcome
          expr: increase(event_store_append_unknown_outcomes_total[5m]) > 0
          for: 2m
          labels: { severity: page }
          annotations:
            summary: Event Store append acknowledgement has an unknown outcome
        - alert: EventStoreAppendFailureRateHigh
          expr: sum(rate(event_store_append_failures_total[5m])) / clamp_min(sum(rate(event_store_append_total[5m])), 1) > 0.01
          for: 5m
          labels: { severity: page }
          annotations:
            summary: Event Store append failure rate exceeds one percent
        - alert: EventStoreConnectSourceDisconnected
          expr: min(event_store_connect_source_connected) < 1 or absent(event_store_connect_source_connected)
          for: 30s
          labels: { severity: page }
          annotations:
            summary: Debezium source connector is disconnected
        - alert: EventStoreConnectTaskDisconnected
          expr: min(event_store_connect_task_connected) < 1 or absent(event_store_connect_task_connected)
          for: 30s
          labels: { severity: page }
          annotations:
            summary: Debezium connector task is disconnected or its metrics are absent
        - alert: EventStoreConnectSourceLagP99High
          expr: max(event_store_connect_milliseconds_behind_source_p99) > 50
          for: 2m
          labels: { severity: page }
          annotations:
            summary: Debezium source-to-connector p99 lag exceeds 50 ms
        - alert: EventStoreCommitToConsumerP50High
          expr: histogram_quantile(0.5, sum(rate(event_store_cdc_commit_to_consumer_latency_seconds_bucket[5m])) by (le)) > 0.05
          for: 2m
          labels: { severity: page }
          annotations:
            summary: PostgreSQL recorded_at to read_committed consumer p50 exceeds 50 ms
        - alert: EventStoreCommitToConsumerP95High
          expr: histogram_quantile(0.95, sum(rate(event_store_cdc_commit_to_consumer_latency_seconds_bucket[5m])) by (le)) > 0.1
          for: 2m
          labels: { severity: page }
          annotations:
            summary: PostgreSQL recorded_at to read_committed consumer p95 exceeds 100 ms
        - alert: EventStoreCommitToConsumerProbeUnavailable
          expr: min(event_store_cdc_latency_probe_up) < 1 or absent(event_store_cdc_latency_probe_up)
          for: 30s
          labels: { severity: page }
          annotations:
            summary: Commit-to-consumer latency probe is unavailable
        - alert: EventStoreConnectQueueNearSaturation
          expr: min(event_store_connect_queue_remaining_capacity / clamp_min(event_store_connect_queue_total_capacity, 1)) < 0.2
          for: 2m
          labels: { severity: page }
          annotations:
            summary: Debezium queue has less than 20 percent capacity remaining
        - alert: EventStoreKafkaUnderReplicatedPartitions
          expr: max(kafka_server_replicamanager_underreplicatedpartitions) > 0
          for: 1m
          labels: { severity: page }
          annotations:
            summary: Kafka has under-replicated Event Store partitions
        - alert: EventStoreKafkaUnderMinIsr
          expr: max(kafka_server_replicamanager_underminisrpartitioncount) > 0
          for: 1m
          labels: { severity: page }
          annotations:
            summary: Kafka has partitions below min.insync.replicas
        - alert: EventStoreProjectionPoisonEvent
          expr: increase(event_store_projection_poison_events_total[5m]) > 0
          for: 1m
          labels: { severity: page }
          annotations:
            summary: A projection partition is paused on a poison event
        - alert: EventStoreProjectionCheckpointStale
          expr: max(event_store_projection_checkpoint_age_seconds) > 300
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: A projection checkpoint is over five minutes old
        - alert: EventStoreLogicalSlotWalWarning
          expr: max(cnpg_event_store_logical_slot_retained_wal_bytes) > 4294967296
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: Event Store logical slot retains over 50 percent of its WAL budget
        - alert: EventStoreLogicalSlotWalHigh
          expr: max(cnpg_event_store_logical_slot_retained_wal_bytes) > 6012954214
          for: 2m
          labels: { severity: page }
          annotations:
            summary: Event Store logical slot retains over 70 percent of its WAL budget
        - alert: EventStoreLogicalSlotWalCritical
          expr: max(cnpg_event_store_logical_slot_retained_wal_bytes) > 7301444403
          for: 1m
          labels: { severity: page }
          annotations:
            summary: Event Store logical slot retains over 85 percent of its WAL budget
        - alert: EventStoreLogicalSlotInvalidated
          expr: max(cnpg_event_store_logical_slot_invalidated) > 0
          for: 1m
          labels: { severity: page }
          annotations:
            summary: Event Store logical replication slot was invalidated
        - alert: EventStoreLogicalSlotUnsyncedStandby
          expr: max(cnpg_event_store_logical_slot_unsynced_standby) > 0
          for: 1m
          labels: { severity: page }
          annotations:
            summary: A standby logical replication slot is not synchronized
