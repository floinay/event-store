apiVersion: batch/v1
kind: Job
metadata:
  name: event-store-bootstrap
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: event-store-bootstrap:1.0.0
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: event-store-migrator, key: database-url }
            - name: REPLICATION_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: event-store-cdc, key: database-url }
            - name: KAFKA_BROKERS
              value: event-store-kafka-kafka-bootstrap:9092
            - name: CONNECT_URL
              value: http://event-store-connect:8083
            - name: CDC_WAL_BUDGET_BYTES
              value: "8589934592"
            - name: CONNECTOR_CONFIG_PATH
              value: /app/deploy/connector/event-store-live.json
            - name: TOPICS_CONFIG_PATH
              value: /app/deploy/kafka/topics.json
