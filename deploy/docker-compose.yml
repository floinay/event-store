# Local/dev topology only. Production uses the Kubernetes bootstrap job and
# RF=3 topics from deploy/kafka/topics.json.
services:
  postgres:
    image: postgres:18.4-bookworm
    networks:
      default:
        aliases: [event-store-postgres-rw]
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
        "-c",
        "synchronous_commit=on",
        "-c",
        "archive_mode=on",
        "-c",
        "archive_timeout=60s",
        "-c",
        "archive_command=mkdir -p /var/lib/postgresql/archive && test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f",
      ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_store
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_store"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal-archive:/var/lib/postgresql/archive
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  connect:
    image: quay.io/debezium/connect:3.6.0.Final
    depends_on: [postgres, kafka]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: event-store-connect
      CONFIG_STORAGE_TOPIC: _connect-event-store-configs
      OFFSET_STORAGE_TOPIC: _connect-event-store-offsets
      STATUS_STORAGE_TOPIC: _connect-event-store-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      EXACTLY_ONCE_SOURCE_SUPPORT: enabled
      CONNECT_EXACTLY_ONCE_SOURCE_SUPPORT: enabled
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
    secrets:
      - source: db-properties
        target: db.properties
  bootstrap:
    build:
      context: ..
      dockerfile: deploy/event-store/Bootstrap.Dockerfile
    depends_on: [postgres, kafka, connect]
    restart: on-failure
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_store
      REPLICATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_store
      KAFKA_BROKERS: kafka:29092
      CONNECT_URL: http://connect:8083
      CDC_WAL_BUDGET_BYTES: "8589934592"
      CONNECTOR_CONFIG_PATH: /app/deploy/connector/event-store-live.json
      TOPICS_CONFIG_PATH: /app/deploy/kafka/topics.local.json
      MIGRATE_CLUSTER: "true"
      EVENT_STORE_ROLE_PASSWORDS_JSON: '{"event_store_cdc":"${EVENT_STORE_CDC_PASSWORD:?set EVENT_STORE_CDC_PASSWORD}"}'
volumes:
  postgres-data:
  postgres-wal-archive:
secrets:
  db-properties:
    file: ${EVENT_STORE_DB_PROPERTIES_FILE:?set EVENT_STORE_DB_PROPERTIES_FILE to a db.properties secret}
